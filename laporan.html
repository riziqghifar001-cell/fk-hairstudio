<script>

let data=[];


function today(){

const d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

function dateObj(date){

const p=String(date).split("-");

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatDate(d){

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

function formatTanggal(tanggal){

if(!tanggal) return "-";

const p=String(tanggal).split("-");

if(p.length!==3) return String(tanggal);

const bulan=[
"Januari","Februari","Maret","April","Mei","Juni",
"Juli","Agustus","September","Oktober","November","Desember"
];

return Number(p[2])+" "+bulan[Number(p[1])-1]+" "+p[0];

}

function norm(hp){

let x=String(hp||"").replace(/\D/g,"");

if(x.startsWith("62")){
x="0"+x.substring(2);
}

return x;

}

function rupiah(n){

return new Intl.NumberFormat("id-ID",{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}).format(Number(n)||0);

}

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function clock(){

document.getElementById("clock").textContent=
new Date().toLocaleTimeString("id-ID",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});

}

setInterval(clock,1000);
clock();

function getRange(){

const mode=
document.getElementById("periode").value;

const now=dateObj(today());

if(mode==="hari"){
return [today(),today()];
}

if(mode==="kemarin"){

const d=new Date(now);

d.setDate(d.getDate()-1);

const x=formatDate(d);

return [x,x];

}

if(mode==="minggu"){

const start=new Date(now);

start.setDate(start.getDate()-6);

return [
formatDate(start),
today()
];

}

if(mode==="bulan"){

const start=
new Date(
now.getFullYear(),
now.getMonth(),
1
);

return [
formatDate(start),
today()
];

}

if(mode==="custom"){

const x=
document.getElementById("tanggal").value||
today();

return [x,x];

}

return [
"0000-01-01",
"9999-12-31"
];

}

function ubahPeriode(){

const custom=
document.getElementById("periode").value==="custom";

document.getElementById("tanggal").disabled=!custom;

render();

}

function render(){

const [start,end]=getRange();

const filtered=
data.filter(x=>
String(x.tanggal)>=start&&
String(x.tanggal)<=end
);

const selesai=
filtered.filter(x=>x.status==="Selesai");

const omzet=
selesai.reduce(
(a,b)=>a+Number(b.harga||0),
0
);

const uniquePhones=
new Set(
filtered
.map(x=>norm(x.hp))
.filter(Boolean)
);

document.getElementById("omzet").textContent=
rupiah(omzet);

document.getElementById("pelanggan").textContent=
uniquePhones.size;

document.getElementById("transaksi").textContent=
selesai.length;

document.getElementById("rata").textContent=
rupiah(
selesai.length?
omzet/selesai.length:
0
);

const services={};

selesai.forEach(x=>{

services[x.layanan]=
(services[x.layanan]||0)+1;

});

const serviceSorted=
Object.entries(services)
.sort((a,b)=>b[1]-a[1]);

document.getElementById("services").innerHTML=
serviceSorted.length?

serviceSorted.map(x=>
'<div class="service-row">'+
'<span>'+escapeHTML(x[0])+'</span>'+
'<strong>'+x[1]+'x</strong>'+
'</div>'
).join(""):

'<div class="empty">Belum ada transaksi selesai.</div>';

let baru=0;
let lama=0;

[...uniquePhones].forEach(phone=>{

const semua=
data.filter(x=>norm(x.hp)===phone);

if(semua.length<=1){
baru++;
}else{
lama++;
}

});

document.getElementById("customerInfo").innerHTML=
'<div class="service-row">'+
'<span>Customer unik</span>'+
'<strong>'+uniquePhones.size+'</strong>'+
'</div>'+

'<div class="service-row">'+
'<span>Customer baru</span>'+
'<strong>'+baru+'</strong>'+
'</div>'+

'<div class="service-row">'+
'<span>Customer lama</span>'+
'<strong>'+lama+'</strong>'+
'</div>';

const transactions=
[...filtered].sort((a,b)=>
String(b.tanggal).localeCompare(String(a.tanggal))||
Number(b.id||0)-Number(a.id||0)
);

document.getElementById("transactions").innerHTML=
transactions.length?

transactions.map(x=>
'<tr>'+
'<td>'+escapeHTML(formatTanggal(x.tanggal))+'</td>'+
'<td>'+escapeHTML(x.nomorAntrean)+'</td>'+
'<td>'+escapeHTML(x.nama)+'</td>'+
'<td>'+escapeHTML(x.layanan)+'</td>'+
'<td>'+escapeHTML(x.jenis)+'</td>'+
'<td>'+escapeHTML(x.status)+'</td>'+
'<td>'+rupiah(x.harga)+'</td>'+
'</tr>'
).join(""):

'<tr><td colspan="7">'+
'<div class="empty">Tidak ada data pada periode ini.</div>'+
'</td></tr>';

}

document.getElementById("tanggal").value=today();

document.getElementById("tanggal").disabled=true;

render();

</script>

<script id="fk-supabase-migration">

let fkReportData=[];

function fkToday(){

    const d=new Date();

    return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0");
}

function fkRupiah(n){

    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(Number(n)||0);
}

function fkNorm(hp){

    let x=String(hp||"").replace(/\D/g,"");

    if(x.startsWith("62"))
        x="0"+x.substring(2);

    return x;
}

function fkEscape(v){

    return String(v??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function fkFormatTanggal(t){

    if(!t) return "-";

    const p=String(t).split("-");

    if(p.length!==3) return t;

    const bulan=[
        "Januari","Februari","Maret","April","Mei","Juni",
        "Juli","Agustus","September","Oktober","November","Desember"
    ];

    return Number(p[2])+" "+
        bulan[Number(p[1])-1]+" "+p[0];
}

function fkRange(){

    const mode =
        document.getElementById("periode")
            ?.value || "hari";

    const today=fkToday();

    if(mode==="hari")
        return [today,today];

    const now=new Date();

    if(mode==="kemarin"){

        now.setDate(now.getDate()-1);

        const x=
            now.getFullYear()+"-"+
            String(now.getMonth()+1).padStart(2,"0")+"-"+
            String(now.getDate()).padStart(2,"0");

        return [x,x];
    }

    if(mode==="minggu"){

        now.setDate(now.getDate()-6);

        const x=
            now.getFullYear()+"-"+
            String(now.getMonth()+1).padStart(2,"0")+"-"+
            String(now.getDate()).padStart(2,"0");

        return [x,today];
    }

    if(mode==="bulan"){

        const x=
            now.getFullYear()+"-"+
            String(now.getMonth()+1).padStart(2,"0")+
            "-01";

        return [x,today];
    }

    if(mode==="custom"){

        const x=
            document.getElementById("tanggal")
                ?.value || today;

        return [x,x];
    }

    return ["0000-01-01","9999-12-31"];
}

function ubahPeriode(){

    const custom =
        document.getElementById("periode")
            ?.value==="custom";

    const tanggal =
        document.getElementById("tanggal");

    if(tanggal)
        tanggal.disabled=!custom;

    render();
}

async function render(){

    const session =
        await FKDB.auth.getSession();

    if(!session.data.session){

        fkShowLogin();

        return;
    }

    const [start,end]=fkRange();

    const {data,error} =
        await FKDB
            .from("bookings")
            .select("*")
            .gte("tanggal",start)
            .lte("tanggal",end)
            .order("tanggal",{ascending:false})
            .order("dibuat_pada",{ascending:false});

    if(error){

        alert(
            "Gagal membaca laporan:\n"+
            error.message
        );

        return;
    }

    fkReportData=data||[];

    const selesai =
        fkReportData.filter(
            x=>x.status==="Selesai"
        );

    const omzet =
        selesai.reduce(
            (a,b)=>a+Number(b.harga||0),
            0
        );

    const uniquePhones =
        new Set(
            fkReportData
                .map(x=>fkNorm(x.hp))
                .filter(Boolean)
        );

    document.getElementById("omzet").textContent =
        fkRupiah(omzet);

    document.getElementById("pelanggan").textContent =
        uniquePhones.size;

    document.getElementById("transaksi").textContent =
        selesai.length;

    document.getElementById("rata").textContent =
        fkRupiah(
            selesai.length
            ? omzet/selesai.length
            : 0
        );

    const services={};

    selesai.forEach(function(x){

        services[x.layanan] =
            (services[x.layanan]||0)+1;
    });

    const sorted =
        Object.entries(services)
            .sort((a,b)=>b[1]-a[1]);

    document.getElementById("services").innerHTML =
        sorted.length
        ? sorted.map(function(x){

            return (
                '<div class="service-row">' +
                '<span>'+
                fkEscape(x[0])+
                '</span>' +
                '<strong>'+
                x[1]+'x'+
                '</strong>' +
                '</div>'
            );

        }).join("")
        : '<div class="empty">Belum ada transaksi selesai.</div>';

    const counts={};

    fkReportData.forEach(function(x){

        const hp=fkNorm(x.hp);

        if(hp)
            counts[hp]=(counts[hp]||0)+1;
    });

    const baru =
        Object.values(counts)
            .filter(x=>x===1).length;

    const lama =
        Object.values(counts)
            .filter(x=>x>1).length;

    document.getElementById("customerInfo").innerHTML =
        '<div class="service-row">' +
        '<span>Customer unik</span>' +
        '<strong>'+
        uniquePhones.size+
        '</strong></div>' +

        '<div class="service-row">' +
        '<span>Customer baru</span>' +
        '<strong>'+
        baru+
        '</strong></div>' +

        '<div class="service-row">' +
        '<span>Customer lama</span>' +
        '<strong>'+
        lama+
        '</strong></div>';

    document.getElementById("transactions").innerHTML =
        fkReportData.length
        ? fkReportData.map(function(x){

            return (
                '<tr>' +

                '<td>'+
                fkEscape(
                    fkFormatTanggal(x.tanggal)
                )+
                '</td>' +

                '<td>'+
                fkEscape(x.nomor_antrean)+
                '</td>' +

                '<td>'+
                fkEscape(x.nama)+
                '</td>' +

                '<td>'+
                fkEscape(x.layanan)+
                '</td>' +

                '<td>'+
                fkEscape(x.jenis)+
                '</td>' +

                '<td>'+
                fkEscape(x.status)+
                '</td>' +

                '<td>'+
                fkRupiah(x.harga)+
                '</td>' +

                '</tr>'
            );

        }).join("")
        :
        '<tr><td colspan="7">' +
        '<div class="empty">Tidak ada data pada periode ini.</div>' +
        '</td></tr>';
}

function fkShowLogin(){

    if(document.getElementById("fkAdminLogin"))
        return;

    const style=document.createElement("style");

style.textContent=`

            position:fixed;

            display:flex;

        }

        }

        }

        }

        #fkAdminLogin button{

        }

        }
`;

document.head.appendChild(style);

    const box=document.createElement("div");

box.id="fkAdminLogin";

box.innerHTML=`

            <h2>FK ADMIN</h2>
            <p>Login untuk mengakses laporan FK Hairstudio.</p>

            <input id="fkAdminEmail" type="email" placeholder="Email admin">
            <input id="fkAdminPassword" type="password" placeholder="Password">

            <button onclick="fkLogin()">LOGIN</button>

            <div id="fkAdminError"></div>
        </div>
`;

document.body.appendChild(box);
}

async function fkLogin(){

    const email =
        document.getElementById("fkAdminEmail")
            .value.trim();

    const password =
        document.getElementById("fkAdminPassword")
            .value;

    const {error} =
        await FKDB.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        document.getElementById("fkAdminError")
            .textContent=
            "Login gagal: "+error.message;

        return;
    }

    document
        .getElementById("fkAdminLogin")
        ?.remove();

    render();
}

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const {data,error} =
            await FKDB.auth.getSession();

        if(error || !data.session){

            fkShowLogin();

            return;
        }

        document.getElementById("tanggal").value =
            fkToday();

        document.getElementById("tanggal").disabled =
            true;

        await render();
    }
);


/* FK REALTIME SYNC */
if (window.FKDB) {
    window.FKDB
        .channel("fk-laporan-bookings")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "bookings"
            },
            function () {
                if (typeof loadData === "function") {
                    loadData();
                } else if (typeof fkLoadReport === "function") {
                    fkLoadReport();
                } else if (typeof render === "function") {
                    render();
                }
            }
        )
        .subscribe();
}</script>
